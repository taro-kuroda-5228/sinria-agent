apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sinria-bridge
      namespace: sinria-local
      labels:
        app.kubernetes.io/name: sinria-bridge
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: sinria-bridge
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sinria-bridge
            sinria.ai/component: bridge
        spec:
          serviceAccountName: sinria-bridge
          containers:
            - name: bridge
              image: ghcr.io/taro-kuroda-5228/sinria-agent:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/sinria-hybrid-bridge-worker.py"]
              args: ["--dry-run"]
              envFrom:
                - configMapRef:
                    name: sinria-bridge-config
                - secretRef:
                    name: sinria-bridge-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sinria-worker-short
      namespace: sinria-local
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: sinria-worker-short
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sinria-worker-short
            sinria.ai/component: worker
        spec:
          serviceAccountName: sinria-worker
          containers:
            - name: worker
              image: ghcr.io/taro-kuroda-5228/sinria-agent:latest
              command: ["sinria"]
              args: ["--help"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sinria-tool-executor
      namespace: sinria-local
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: sinria-tool-executor
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sinria-tool-executor
            sinria.ai/component: tool-executor
        spec:
          serviceAccountName: sinria-tool-executor
          containers:
            - name: tool-executor
              image: ghcr.io/taro-kuroda-5228/sinria-agent:latest
              command: ["sinria"]
              args: ["--help"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
