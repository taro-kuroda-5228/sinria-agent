name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install release test environment
        run: uv sync --extra dev

      - name: Verify tag matches product version
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Run public distribution release gate
        run: |
          scripts/run_tests.sh \
            tests/test_sinria_product_metadata.py \
            tests/test_sinria_installers_branding.py \
            tests/test_distribution_release_contract.py \
            tests/scripts/test_release_acp_registry.py \
            tests/scripts/test_audit_release_artifacts.py \
            tests/hermes_cli/test_banner.py \
            tests/hermes_cli/test_doctor_command_install.py \
            tests/acp/test_registry_manifest.py \
            -q

      - name: Build wheel and source distribution
        run: uv build --sdist --wheel

      - name: Verify built distributions
        run: |
          uvx twine check dist/*
          uv run python scripts/audit_release_artifacts.py dist/*.whl dist/*.tar.gz

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.11 /tmp/sinria-release-smoke
          uv pip install --python /tmp/sinria-release-smoke/bin/python dist/*.whl
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" SINRIA_HOME="$tmp_home/.sinria" /tmp/sinria-release-smoke/bin/sinria --help >/dev/null
          HOME="$tmp_home" SINRIA_HOME="$tmp_home/.sinria" /tmp/sinria-release-smoke/bin/sinria doctor >/tmp/sinria-doctor.txt
          ! grep -q "Reinstall entry point" /tmp/sinria-doctor.txt

      - name: Stage installers and checksums
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish immutable GitHub Release assets
        uses: softprops/action-gh-release@6cbd405e2c59b5d8d3ec0e51e8b80618e497786c  # v2.5.0
        with:
          generate_release_notes: true
          files: |
            dist/*
