name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run public distribution smoke tests
        run: |
          scripts/run_tests.sh \
            tests/test_sinria_product_metadata.py \
            tests/test_sinria_installers_branding.py \
            tests/test_distribution_release_contract.py \
            tests/scripts/test_release_acp_registry.py \
            tests/scripts/test_audit_release_artifacts.py \
            tests/hermes_cli/test_banner.py \
            tests/hermes_cli/test_doctor_command_install.py \
            tests/acp/test_registry_manifest.py \
            -q

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Build and validate distribution artifacts
        run: |
          uv build --sdist --wheel
          uvx twine check dist/*
          uv run python scripts/audit_release_artifacts.py dist/*.whl dist/*.tar.gz
          uv venv --python 3.11 /tmp/sinria-release-smoke
          uv pip install --python /tmp/sinria-release-smoke/bin/python dist/*.whl
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" SINRIA_HOME="$tmp_home/.sinria" /tmp/sinria-release-smoke/bin/sinria --help >/dev/null
          HOME="$tmp_home" SINRIA_HOME="$tmp_home/.sinria" /tmp/sinria-release-smoke/bin/sinria doctor >/tmp/sinria-doctor.txt
          ! grep -q "Reinstall entry point" /tmp/sinria-doctor.txt

        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
